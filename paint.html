<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دهانات</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:#fff;
  background:#000;
}

/* الخلفية */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:url('https://images.unsplash.com/photo-1523413651479-597eb2da0ad6?auto=format&fit=crop&w=1400&q=80') center/cover;
  position:relative;
  animation: zoom 20s infinite alternate;
}

@keyframes zoom{
  from{background-size:100%;}
  to{background-size:110%;}
}

.hero::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
}

.content{
  position:relative;
  z-index:2;
}

/* العنوان */
h1{
  font-size:80px;
  background:#ff9800;
  color:#000;
  display:inline-block;
  padding:10px 25px;
  border-radius:15px;
}

/* النص */
p{
  font-size:26px;
  margin-top:10px;
}

/* زر الرجوع */
a{
  display:inline-block;
  margin-top:25px;
  padding:12px 25px;
  background:#ff9800;
  color:#000;
  text-decoration:none;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  transition:0.3s;
}

a:hover{
  background:#fff;
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="hero">
  <div class="content">
    <h1>دهانات</h1>
    <p>أفضل ألوان وتشطيب احترافي</p>

    <a href="index.html">رجوع</a>
  </div>
</div>

</body>
</html>
