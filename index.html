<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المناهري</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
}

/* الخلفية */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1400&q=80') center/cover;
  position:relative;
  animation: zoom 20s infinite alternate;
}

@keyframes zoom{
  from{background-size:100%;}
  to{background-size:110%;}
}

.hero::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
}

.content{
  position:relative;
  z-index:2;
}

/* العنوان */
h1{
  font-size:85px;
  color:#000;
  background:#ff9800;
  display:inline-block;
  padding:10px 25px;
  border-radius:15px;
}

/* الوصف */
p{
  font-size:28px;
  margin-top:10px;
}

/* القائمة */
.menu{
  margin-top:35px;
}

a{
  display:block;
  margin:12px auto;
  padding:14px 25px;
  width:220px;
  background:#ff9800;
  color:#000;
  text-decoration:none;
  border-radius:12px;
  font-size:22px;
  font-weight:bold;
  transition:0.3s;
}

a:hover{
  background:#fff;
  color:#000;
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="hero">
  <div class="content">
    <h1>المناهري</h1>
    <p>دهانات - بديل خشب - رخام - تشطيب</p>

    <div class="menu">
      <a href="wood.html">بديل خشب</a>
      <a href="marble.html">رخام</a>
      <a href="paint.html">دهانات</a>
    </div>
  </div>
</div>

</body>
</html>
