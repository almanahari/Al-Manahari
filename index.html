<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>المناهري - دهانات وتشطيب</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
}

/* الخلفية */
.hero{
  height:100vh;
  width:100%;
  background-size: cover;
  background-position: center;
  transition: 0.8s ease-in-out;
  position: relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* طبقة غامقة */
.hero::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.55);
}

/* المحتوى */
.content{
  position:relative;
  z-index:2;
  color:#fff;
  text-align:center;
}

h1{
  font-size:55px;
  margin-bottom:10px;
}

h2{
  font-size:22px;
  margin-bottom:25px;
}

/* زر */
.btn{
  padding:12px 25px;
  background:#ff9800;
  border:none;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
}

/* الأزرار السفلية */
.menu{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  z-index:3;
}

.card{
  padding:10px 15px;
  background:rgba(255,255,255,0.2);
  color:#fff;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
  backdrop-filter: blur(6px);
}

.card:hover{
  background:rgba(255,255,255,0.35);
}
</style>
</head>

<body>

<div class="hero" id="hero">

  <div class="content">
    <h1>المناهري</h1>
    <h2>دهانات - بديل خشب - رخام - تشطيب حديث</h2>
    <button class="btn" onclick="window.open('https://wa.me/201234567890','_blank')">
      تواصل واتساب
    </button>
  </div>

  <div class="menu">
    <div class="card" onclick="setBg('https://images.unsplash.com/photo-1505691938895-1758d7feb511?auto=format&fit=crop&w=1200&q=80')">بديل خشب</div>
    <div class="card" onclick="setBg('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80')">رخام</div>
    <div class="card" onclick="setBg('https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1200&q=80')">دهانات</div>
  </div>

</div>

<script>
const hero = document.getElementById("hero");

function setBg(img){
  hero.style.backgroundImage = `url('${img}')`;
}

// الخلفية الافتراضية
hero.style.backgroundImage = "url('https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1200&q=80')";
</script>

</body>
</html>
